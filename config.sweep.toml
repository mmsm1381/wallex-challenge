# Sweep bot settings. Missing keys use sweepbot/config.py DEFAULTS.
# The numbers come from docs/RESEARCH.md section 3. Change them only after a
# new backtest.

[bot]
mode = "paper"
out_dir = "data/sweepbot"
db_path = "data/sweepbot.db"

[venues]
# The server outside Iran also reaches Binance (port 443) and OKX.
enabled = ["bybit", "kucoin", "gate"]
max_quote_age_s = 10.0
min_venues = 2

[plan]
markets = ["ADATMN", "ETHUSDT", "TRXTMN", "ETHTMN", "PEPEUSDT"]
depth_pct = 1.3
size_tmn = 1000000.0
valid_minutes = 30

[limits]
max_bid_tmn = 1000000.0
max_slots = 5
max_usdt_share = 0.30
min_depth_pct = 1.0
max_depth_pct = 2.5
max_hold_s = 900.0
daily_loss_pct = 1.5
peak_drawdown_pct = 2.5
start_drawdown_pct = 4.0
stop_before_end_s = 7200.0

[challenge]
start_equity_tmn = 5000000.0
# Set the end of the challenge, such as "2026-11-04T20:00:00Z".
end_utc = ""

[ai]
enabled = false
model = "claude-opus-5-5"
timeout_s = 60.0
supervisor_every_s = 900.0
# Model calls stop when the cost in the ai_calls table reaches this limit.
budget_usd = 50.0
