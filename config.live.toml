# Live settings for the challenge account.
# The account starts with toman only. At the start the bot buys USDT for 40%
# of the start equity (funding section), so the bot can bid on USDT markets
# too. [plan] markets are only used when allocation is off (RESEARCH.md 3.2 and 3.4). The bot sells all
# USDT before the last USDTTMN close. Bid size 950,000 leaves room for fees
# and rounding: 3 toman bids need 2.85M of the 3M toman, 2 USDT bids need
# 1.9M of the 2M toman in USDT.
# Missing keys use sweepbot/config.py DEFAULTS.
# The numbers come from docs/RESEARCH.md section 3. Change them only after a
# new backtest.

[bot]
mode = "live"
out_dir = "data/sweepbot-live"
db_path = "data/sweepbot-live.db"

# Both configs share one premium file, so the switch from paper to live
# needs no warm-up of the fair values.
premium_file = "data/premiums.json"

[venues]
# This config runs on the server outside Iran. It reaches all 5 venues.
# From Iran, OKX and Binance are blocked: use bybit, kucoin and gate there.
enabled = ["bybit", "okx", "kucoin", "gate", "binance"]
max_quote_age_s = 10.0
min_venues = 2

[plan]
markets = ["ADATMN", "ETHUSDT", "TRXTMN", "ETHTMN", "PEPEUSDT"]
# Option E of 2026-10-23 (more, smaller bids closer to fair value): in the
# last 31 days out of sample, 9.5 fills a day, 73% wins, +9.4k toman a day,
# max drawdown -11k, against 3.2 fills a day with 1.3% and 5 x 950,000.
depth_pct_tmn = 1.0
depth_pct_usdt = 1.0
size_tmn = 475000.0
valid_minutes = 30

[limits]
max_bid_tmn = 1000000.0
max_slots = 10
max_usdt_share = 0.40
min_depth_pct = 1.0
max_depth_pct = 2.5
max_hold_s = 900.0
daily_loss_pct = 1.5
peak_drawdown_pct = 2.5
start_drawdown_pct = 4.0
# Schedule of the last evening (Tehran = UTC+3:30, the end is 23:50 Tehran):
# stop bids and sell coins at 23:00 Tehran (19:30 UTC), sell USDT from 23:20
# Tehran (19:50 UTC), 10 minutes before the USDTTMN close at 23:30 Tehran.
stop_before_end_s = 3000.0
usdt_sell_before_close_s = 600.0
flatten_before_usdt_s = 1200.0

[challenge]
start_equity_tmn = 5000000.0
# End of the challenge: 2026-10-23 23:50 Tehran = 20:20 UTC.
# With this end, the bot stops bids and sells all coins from 21:50 Tehran
# (18:20 UTC), and sells all USDT from 23:00 Tehran (19:30 UTC), 30 minutes
# before the USDTTMN close at 23:30 Tehran.
end_utc = "2026-10-23T20:20:00Z"

[allocation]
# Watch all 18 markets. Keep bids on the eligible markets with the most fills
# in the 60-day study (ranking in sweepbot/config.py, RESEARCH.md 3.7): 6
# toman places (6 x 475,000 of the 3M toman) and 4 USDT places (4 x 475,000 of
# the 2M toman in USDT that the account already holds; no USDT is bought). An
# eligible market without a place is logged as "qualifies, but no funds".
enabled = true
tmn_slots = 6
usdt_slots = 4
# A better market takes a place from a bid older than this. 60 s missed the
# ADATMN sweep of 2026-10-22 17:11 UTC by about one minute.
switch_min_s = 15.0

[funding]
# 0: never buy USDT. The account already holds 7.34789 USDT (about 2M
# toman) from the first live start on 2026-10-22 13:33 UTC. The user asked
# not to buy more.
usdt_target_share = 0.0
slippage_pct = 0.3

[ai]
# The model runs behind an OpenAI-compatible router (9router). The key is
# AI_API_KEY in the environment (.env), never in this file.
provider = "openai_compat"
base_url = "https://9router.partanon.online/v1"
# GPT first, Gemini as backup (tested 2026-10-22 15:55 UTC on a real plan):
# - cx/gpt-6.1-sol failed: the router's Codex login is invalid (HTTP 401).
#   It stays first, so it is used again when the router owner fixes it.
#   A failure costs under 1 s.
# - ag/gpt-oss-120b-medium: OK, about 29 s.
# - ag/gemini-3-flash: OK, about 1.5 s.
# - ag/gemini-3.8-flash-high: OK, about 32 s.
model = "cx/gpt-6.1-sol"
fallback_models = ["ag/gpt-oss-120b-medium", "ag/gemini-3-flash", "ag/gemini-3.8-flash-high"]
request_timeout_s = 40.0
# The executor never waits for a model, so a long job timeout is safe.
timeout_s = 150.0
# The router does not bill per token.
price_in_per_mtok = 0.0
price_out_per_mtok = 0.0
enabled = true
supervisor_every_s = 900.0
# Model calls stop when the cost in the ai_calls table reaches this limit.
budget_usd = 50.0
